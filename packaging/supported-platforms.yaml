{
  "schema_version": 1,
  "defaults": {
    "prefix": "/usr/local",
    "libdir": "lib",
    "systemd_unit_dir": "lib/systemd/system",
    "package_format": "none",
    "package_name": "nvidia-process-metrics",
    "package_version": "0.1.0",
    "package_release": "1",
    "cuda_root": "/usr/local/cuda",
    "build_cuda_components": true,
    "enable_pm_sampling": true,
    "build_packages": ["g++", "meson", "ninja"]
  },
  "platforms": {
    "generic-linux": {
      "distro_ids": [],
      "description": "Portable Meson installation under /usr/local"
    },
    "fedora": {
      "distro_ids": ["fedora"],
      "description": "Fedora Linux",
      "package_format": "rpm",
      "prefix": "/usr",
      "libdir": "lib64",
      "systemd_unit_dir": "lib/systemd/system",
      "build_packages": ["gcc-c++", "meson", "ninja-build", "rpm-build", "systemd-rpm-macros"]
    },
    "rocky": {
      "distro_ids": ["rocky", "rhel", "centos", "almalinux"],
      "description": "Rocky Linux and Enterprise Linux-compatible distributions",
      "package_format": "rpm",
      "prefix": "/usr",
      "libdir": "lib64",
      "systemd_unit_dir": "lib/systemd/system",
      "build_packages": ["gcc-c++", "meson", "ninja-build", "rpm-build", "systemd-rpm-macros"]
    },
    "rocky-orfeo": {
      "distro_ids": [],
      "description": "Rocky Linux 9 on ORFEO with root PM Sampling daemon",
      "package_format": "rpm",
      "prefix": "/usr",
      "libdir": "lib64",
      "systemd_unit_dir": "lib/systemd/system",
      "cuda_module": "cuda/12.8",
      "cuda_root": "/orfeo/cephfs/opt/programs/intel/almalinux9/cuda/12.8",
      "build_packages": ["gcc-c++", "meson", "ninja-build", "rpm-build", "systemd-rpm-macros"]
    },
    "rocky-orfeo-user": {
      "distro_ids": [],
      "description": "Rocky Linux 9 on ORFEO with an unprivileged user daemon",
      "package_format": "none",
      "prefix": "/usr",
      "libdir": "lib64",
      "systemd_unit_dir": "lib/systemd/system",
      "cuda_module": "cuda/12.8",
      "cuda_root": "/orfeo/cephfs/opt/programs/intel/almalinux9/cuda/12.8",
      "enable_pm_sampling": false,
      "build_packages": ["gcc-c++", "meson", "ninja-build"]
    },
    "ubuntu": {
      "distro_ids": ["ubuntu", "linuxmint", "pop"],
      "description": "Ubuntu and Ubuntu-compatible distributions",
      "package_format": "deb",
      "prefix": "/usr",
      "libdir": "lib",
      "systemd_unit_dir": "lib/systemd/system",
      "build_packages": ["g++", "meson", "ninja-build", "debhelper", "dpkg-dev", "pkg-config"]
    },
    "debian": {
      "distro_ids": ["debian"],
      "description": "Debian GNU/Linux",
      "package_format": "deb",
      "prefix": "/usr",
      "libdir": "lib",
      "systemd_unit_dir": "lib/systemd/system",
      "build_packages": ["g++", "meson", "ninja-build", "debhelper", "dpkg-dev", "pkg-config"]
    }
  }
}
