# Mirrors Efimon's hooks and adds the Google Python checks.
# pm-sampling.{hpp,cu} are adapted NVIDIA CUPTI samples and keep their style.
repos:
-   repo: https://github.com/bmorcos/pre-commit-hooks-cpp
    rev: 9a5aa38207bf557961110d6a4f7e3a9d352911f9
    hooks:
    -   id: clang-format
        args: [--style=google]
        files: ^(include|src)/
        exclude: pm-sampling\.(hpp|cu)$
    -   id: cpplint
        files: ^(include|src)/
        exclude: pm-sampling\.(hpp|cu)$
-   repo: https://github.com/google/pyink
    rev: 26.5.1
    hooks:
    -   id: pyink
        files: ^analyzers/
-   repo: local
    hooks:
    -   id: pylint
        name: pylint
        entry: pylint --rcfile=pylintrc
        language: system
        types: [python]
        files: ^analyzers/
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
    -   id: check-merge-conflict
-   repo: https://github.com/jorisroovers/gitlint
    rev: v0.17.0
    hooks:
    -   id: gitlint
